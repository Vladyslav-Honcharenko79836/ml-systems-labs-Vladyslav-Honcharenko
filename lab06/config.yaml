experiment: lab06-fashion-cnn
run_name: base
seed: 42
deterministic: true
device: auto

paths:
  data_dir: data
  runs_dir: data/lab06_runs
  mlflow_dir: lab06/mlruns

data:
  n_train: 55000
  n_val: 5000
  mean: 0.2860
  std: 0.3530
  batch_size: 128
  num_workers: 4
  pin_memory: true
  persistent_workers: true

model:
  name: CNN

optim:
  name: adam
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0

sched:
  name: none
  step_size: 4
  gamma: 0.1
  t_max: null
  plateau_factor: 0.5
  plateau_patience: 1

train:
  epochs: 10
  accum_steps: 1
  resume: null

mlflow:
  enabled: true
  log_checkpoint: true

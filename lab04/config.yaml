# Lab 4 pipeline configuration. Every script reads its parameters from here.
seed: 42

dataset:
  name: adult
  version: 2              # OpenML id 1590
  expected_rows: 48842
  expected_cols: 15

target:
  column: income          # name used by the pipeline
  source_column: class    # name in the OpenML frame
  positive: ">50K"

split:
  test_size: 0.30
  stratify: true

schema:
  types:
    age: int
    workclass: category
    fnlwgt: int
    education: category
    education-num: int
    marital-status: category
    occupation: category
    relationship: category
    race: category
    sex: category
    capital-gain: int
    capital-loss: int
    hours-per-week: int
    native-country: category
    income: category
  ranges:                 # inclusive
    age: [17, 90]
    hours-per-week: [1, 99]
    capital-gain: [0, 99999]
    capital-loss: [0, 4356]
  missing_token: "?"      # '?' means missing; it is an allowed category value
  allowed_categories:     # data dictionary (UCI adult.names), plus the missing token
    workclass: [Private, Self-emp-not-inc, Self-emp-inc, Federal-gov, Local-gov, State-gov,
                Without-pay, Never-worked]
    education: [Bachelors, Some-college, 11th, HS-grad, Prof-school, Assoc-acdm, Assoc-voc, 9th,
                7th-8th, 12th, Masters, 1st-4th, 10th, Doctorate, 5th-6th, Preschool]
    marital-status: [Married-civ-spouse, Divorced, Never-married, Separated, Widowed,
                     Married-spouse-absent, Married-AF-spouse]
    occupation: [Tech-support, Craft-repair, Other-service, Sales, Exec-managerial,
                 Prof-specialty, Handlers-cleaners, Machine-op-inspct, Adm-clerical,
                 Farming-fishing, Transport-moving, Priv-house-serv, Protective-serv,
                 Armed-Forces]
    relationship: [Wife, Own-child, Husband, Not-in-family, Other-relative, Unmarried]
    race: [White, Asian-Pac-Islander, Amer-Indian-Eskimo, Other, Black]
    sex: [Female, Male]
    native-country: [United-States, Cambodia, England, Puerto-Rico, Canada, Germany,
                     Outlying-US(Guam-USVI-etc), India, Japan, Greece, South, China, Cuba, Iran,
                     Honduras, Philippines, Italy, Poland, Jamaica, Vietnam, Mexico, Portugal,
                     Ireland, France, Dominican-Republic, Laos, Ecuador, Taiwan, Haiti, Columbia,
                     Hungary, Guatemala, Nicaragua, Scotland, Thailand, Yugoslavia, El-Salvador,
                     Trinadad&Tobago, Peru, Hong, Holand-Netherlands]
    income: ["<=50K", ">50K"]

preprocessing:
  numeric_impute: median
  categorical_impute: most_frequent
  clip_percentiles: [1, 99]
  drop_train_duplicates: true

features:
  derived: [capital_net, hours_per_age]

model:
  max_iter: 5000
  C: 1.0

label_audit:
  sample_size: 50
